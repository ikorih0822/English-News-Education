<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EconNews English — 経済ニュースで英語学習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1e3a5f;
      --accent:  #2563eb;
      --accent-l:#dbeafe;
      --bg:      #f1f5f9;
      --text:    #1e293b;
      --muted:   #64748b;
      --border:  #e2e8f0;
      --hl-bg:   #fef9c3;
      --hl-br:   #eab308;
      --green:   #16a34a;
      --red:     #dc2626;
      --ja-bg:   #eff6ff;
      --ja-br:   #93c5fd;
    }
    body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .screen { min-height: 100vh; display: flex; flex-direction: column; }
    .screen.hidden { display: none; }

    /* ══ HEADER ══ */
    .hdr {
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      color: #fff; padding: 13px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      flex-shrink: 0; position: sticky; top: 0; z-index: 200;
    }
    .hdr-logo { font-size: 1.18rem; font-weight: 700; }
    .hdr-sub  { font-size: .68rem; opacity: .8; font-family: sans-serif; margin-top: 2px; }
    .hdr-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .key-status { font-size: .7rem; font-family: sans-serif; display: flex; align-items: center; gap: 4px; opacity: .9; }
    .key-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .key-dot.ok  { background: #4ade80; }
    .key-dot.bad { background: #f87171; }
    .btn-ghost {
      background: rgba(255,255,255,.15); color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      padding: 6px 12px; border-radius: 16px;
      cursor: pointer; font-size: .78rem; font-family: sans-serif;
      transition: background .2s; white-space: nowrap; min-height: 34px;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.28); }

    /* ══ KEY BANNER ══ */
    .key-banner {
      background: #fffbeb; border-bottom: 1px solid #fde68a;
      padding: 13px 16px; font-family: sans-serif; font-size: .83rem;
    }
    .key-banner.hidden { display: none; }
    .key-banner-txt { color: #78350f; line-height: 1.6; margin-bottom: 10px; }
    .key-banner-txt a { color: var(--accent); font-weight: 600; }
    .key-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .key-input {
      flex: 1; min-width: 180px;
      border: 1.5px solid #fbbf24; border-radius: 8px;
      padding: 9px 12px; font-size: .84rem; font-family: sans-serif;
      outline: none; background: #fff; min-height: 42px;
    }
    .key-input:focus { border-color: var(--accent); }
    .btn-sm {
      background: var(--accent); color: #fff; border: none;
      padding: 9px 16px; border-radius: 8px; cursor: pointer;
      font-size: .82rem; font-family: sans-serif; font-weight: 600;
      white-space: nowrap; min-height: 42px;
    }
    .btn-sm.gray { background: #94a3b8; }
    .btn-sm:hover { opacity: .9; }

    /* ══ TABS ══ */
    .tabs-bar { display: flex; background: #fff; border-bottom: 2px solid var(--border); flex-shrink: 0; }
    .tab {
      flex: 1; text-align: center;
      padding: 13px 8px; cursor: pointer;
      font-family: sans-serif; font-size: .84rem; font-weight: 600;
      color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .2s; min-height: 46px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-pane { flex: 1; overflow-y: auto; }
    .tab-pane.hidden { display: none; }

    /* ══ NEWS LIST ══ */
    .list-hd {
      padding: 9px 16px; background: #f8fafc; border-bottom: 1px solid var(--border);
      font-size: .7rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px; font-family: sans-serif;
      display: flex; align-items: center; justify-content: space-between;
    }
    .news-item {
      padding: 14px 16px; border-bottom: 1px solid #f1f5f9;
      cursor: pointer; transition: background .15s; -webkit-tap-highlight-color: transparent;
    }
    .news-item:hover, .news-item:active { background: #f0f7ff; }
    .ni-en { font-size: .9rem; font-weight: 600; line-height: 1.45; color: var(--text); margin-bottom: 5px; }
    .ni-ja {
      font-size: .82rem; color: #1d4ed8; font-family: sans-serif;
      line-height: 1.5; margin-bottom: 5px; min-height: 20px;
    }
    .ni-meta { font-size: .69rem; color: var(--muted); font-family: sans-serif; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .diff { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: .63rem; font-weight: 700; }
    .diff-e { background: #dcfce7; color: #15803d; }
    .diff-m { background: #fef9c3; color: #92400e; }
    .diff-h { background: #fee2e2; color: #b91c1c; }
    .tl-spin {
      display: inline-block; width: 11px; height: 11px;
      border: 1.5px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }

    /* ══ PASTE TAB ══ */
    .paste-area { padding: 22px 16px; max-width: 700px; font-family: sans-serif; }
    .paste-area h3 { font-size: 1rem; color: var(--primary); margin-bottom: 6px; font-family: Georgia, serif; }
    .paste-area p  { font-size: .83rem; color: var(--muted); margin-bottom: 12px; line-height: 1.65; }
    .paste-sites { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
    .paste-sites span { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: .74rem; color: var(--muted); }

    /* ══ FREE LINKS ══ */
    .free-news-block { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; margin-bottom: 18px; }
    .free-news-hd { font-size: .9rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; font-family: sans-serif; }
    .free-news-sub { font-size: .76rem; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
    .site-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .site-btn {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: #fff; font-size: .78rem; font-family: sans-serif;
      cursor: pointer; transition: all .18s; color: var(--text); min-height: 34px;
    }
    .site-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .art-links-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .art-link-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 13px;
      background: #fff; border-bottom: 1px solid var(--border);
      text-decoration: none; color: var(--text); transition: background .15s;
    }
    .art-link-item:last-child { border-bottom: none; }
    .art-link-item:hover { background: var(--accent-l); }
    .art-link-title { font-size: .84rem; line-height: 1.5; flex: 1; }
    .art-link-date { font-size: .71rem; color: var(--muted); white-space: nowrap; font-family: sans-serif; padding-top: 2px; flex-shrink: 0; }
    .art-links-loading { text-align: center; padding: 22px; color: var(--muted); font-family: sans-serif; font-size: .84rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .art-links-err { padding: 14px; color: var(--muted); font-family: sans-serif; font-size: .82rem; text-align: center; }
    .art-links-direct { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); transition: background .15s; }
    .art-links-direct:hover { background: var(--accent-l); }
    .paste-title-in {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 10px 13px; font-size: .9rem; font-family: sans-serif;
      margin-bottom: 10px; outline: none; min-height: 44px; font-size: 16px;
    }
    .paste-title-in:focus { border-color: var(--accent); }
    textarea.paste-body {
      width: 100%; height: 240px; border: 1.5px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 16px;
      font-family: Georgia, serif; line-height: 1.8; resize: vertical; outline: none;
    }
    textarea.paste-body:focus { border-color: var(--accent); }
    .btn-start {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; border: none;
      padding: 13px 26px; border-radius: 26px; font-size: .93rem; font-weight: 700;
      cursor: pointer; font-family: sans-serif; margin-top: 12px;
      box-shadow: 0 4px 14px rgba(37,99,235,.3); transition: background .2s, transform .1s; min-height: 50px;
    }
    .btn-start:hover { background: #1d4ed8; transform: translateY(-1px); }

    /* ══ ARTICLE SCREEN ══ */
    .art-hdr {
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      color: #fff; padding: 11px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      flex-shrink: 0; position: sticky; top: 0; z-index: 200;
    }
    .art-hdr-left  { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .art-hdr-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .btn-back {
      background: rgba(255,255,255,.15); color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      padding: 7px 14px; border-radius: 16px;
      cursor: pointer; font-size: .82rem; font-family: sans-serif;
      display: flex; align-items: center; gap: 4px;
      transition: background .2s; flex-shrink: 0; min-height: 36px;
    }
    .btn-back:hover { background: rgba(255,255,255,.28); }
    .art-hdr-title {
      font-size: .75rem; opacity: .82; font-family: sans-serif;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Full-translation button */
    .btn-full-tl {
      background: rgba(255,255,255,.18); color: #fff;
      border: 1px solid rgba(255,255,255,.35);
      padding: 6px 13px; border-radius: 16px;
      cursor: pointer; font-size: .8rem; font-family: sans-serif;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; min-height: 34px; transition: background .2s;
    }
    .btn-full-tl:hover { background: rgba(255,255,255,.3); }

    .art-wrap { flex: 1; overflow-y: auto; padding: 24px 16px; max-width: 780px; margin: 0 auto; width: 100%; }

    .art-badge {
      display: inline-block; background: var(--accent-l); color: var(--accent);
      padding: 3px 11px; border-radius: 11px;
      font-size: .7rem; font-weight: 700; font-family: sans-serif;
      text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px;
    }
    .art-title-en { font-size: 1.45rem; font-weight: 700; line-height: 1.35; color: var(--primary); margin-bottom: 8px; }
    .art-title-ja {
      font-size: .92rem; color: #1d4ed8; font-family: sans-serif;
      font-weight: 600; line-height: 1.55; margin-bottom: 14px;
      padding: 8px 12px; background: var(--accent-l);
      border-radius: 8px; border-left: 3px solid var(--accent);
    }
    .art-meta {
      font-size: .76rem; color: var(--muted); font-family: sans-serif;
      display: flex; gap: 12px; flex-wrap: wrap;
      padding-bottom: 14px; border-bottom: 2px solid var(--border); margin-bottom: 18px;
    }
    .art-meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .art-meta a:hover { text-decoration: underline; }
    .stats-bar {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 9px 12px; background: #f8fafc;
      border-radius: 9px; border: 1px solid var(--border);
      font-family: sans-serif; font-size: .74rem; color: var(--muted); margin-bottom: 24px;
    }

    /* ══ SENTENCE-LEVEL LAYOUT ══ */
    .para-block { margin-bottom: 22px; }

    .sent-item { margin-bottom: 8px; }

    .sent-en-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }
    /* The small 🇯🇵 touch target */
    .sent-btn {
      flex-shrink: 0;
      width: 24px; height: 24px;
      background: var(--accent-l);
      border: none; border-radius: 50%;
      cursor: pointer;
      font-size: .65rem;
      display: flex; align-items: center; justify-content: center;
      margin-top: 4px; /* visual align with first line of text */
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sent-btn:hover   { background: #bfdbfe; }
    .sent-btn.active  { background: var(--accent); }

    .sent-en {
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--text);
      flex: 1;
    }

    /* Japanese reveal area */
    .sent-ja {
      margin-left: 31px;   /* indent to align with sentence text */
      font-family: sans-serif;
      font-size: .9rem;
      line-height: 1.75;
      color: #1e40af;
      background: var(--ja-bg);
      border-left: 3px solid var(--ja-br);
      padding: 6px 12px;
      border-radius: 0 7px 7px 0;
      margin-top: 3px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height .3s ease, opacity .25s ease, padding .2s;
    }
    .sent-ja.open {
      max-height: 300px;
      opacity: 1;
      padding: 6px 12px;
    }
    .sent-ja.loading { color: var(--muted); font-style: italic; }

    /* Vocab highlight */
    .vt {
      background: var(--hl-bg); border-bottom: 2px solid var(--hl-br);
      cursor: pointer; border-radius: 2px; padding: 0 2px; transition: background .15s;
    }
    .vt:hover { background: #fde68a; }

    /* ══ VOCAB SECTION ══ */
    .vocab-sec { margin-top: 38px; padding-top: 26px; border-top: 2px solid var(--border); font-family: sans-serif; }
    .vocab-sec-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .vocab-sec-hd h3 { font-size: .85rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: .6px; }
    .vocab-cnt { font-size: .74rem; color: var(--muted); }
    .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .vc {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 13px; cursor: pointer; transition: box-shadow .2s, transform .1s;
    }
    .vc:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-1px); }
    .vc-term { font-weight: 700; color: var(--primary); font-size: .88rem; margin-bottom: 2px; }
    .vc-ja   { font-size: .69rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    .vc-def  { font-size: .73rem; color: var(--muted); line-height: 1.5; }
    .btn-quiz {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; border: none;
      padding: 12px 26px; border-radius: 26px;
      font-size: .92rem; font-weight: 700; cursor: pointer; font-family: sans-serif;
      box-shadow: 0 4px 14px rgba(37,99,235,.3); transition: background .2s, transform .1s; min-height: 48px;
    }
    .btn-quiz:hover { background: #1d4ed8; transform: translateY(-1px); }

    /* ══ POPUP (vocab) ══ */
    .popup {
      position: fixed; background: #fff; border-radius: 14px;
      box-shadow: 0 14px 45px rgba(0,0,0,.18);
      padding: 17px 19px 15px; max-width: 310px; width: 92%;
      z-index: 600; border: 1px solid var(--border);
      font-family: sans-serif; animation: popIn .15s ease;
    }
    .popup.hidden { display: none; }
    @keyframes popIn { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
    .pop-x { position: absolute; top:10px; right:12px; background:none; border:none; font-size:1rem; cursor:pointer; color:var(--muted); min-width:28px; min-height:28px; }
    .pop-x:hover { color: var(--text); }
    .pop-word { font-size: 1.18rem; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .pop-pos  { font-size: .69rem; color: var(--muted); font-style: italic; margin-bottom: 3px; }
    .pop-ja   { font-size: .8rem; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .pop-def  { font-size: .84rem; line-height: 1.6; color: var(--text); margin-bottom: 8px; }
    .pop-ex   { font-size: .76rem; color: var(--muted); font-style: italic; border-left: 3px solid var(--accent); padding-left: 9px; line-height: 1.55; }

    /* ══ MODALS (quiz + full-tl) ══ */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.52);
      z-index: 900; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); padding: 14px;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #fff; border-radius: 18px; padding: 26px 22px;
      max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,.22); font-family: sans-serif;
    }
    .modal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--primary); font-family: Georgia, serif; }
    .modal-x { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
    .modal-x:hover { background: var(--border); }

    /* Full translation modal */
    .full-tl-para { margin-bottom: 16px; font-size: .94rem; line-height: 1.9; font-family: sans-serif; color: #1e3a5f; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .full-tl-para:last-child { border-bottom: none; }
    .full-tl-progress { font-size: .78rem; color: var(--muted); margin-bottom: 12px; }

    /* Quiz */
    .q-prog-lbl  { font-size: .74rem; color: var(--muted); margin-bottom: 5px; }
    .q-prog-bar  { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 20px; }
    .q-prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
    .q-text  { font-size: .96rem; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.5; }
    .q-hint  { font-size: .74rem; color: var(--muted); margin-bottom: 15px; }
    .q-opts  { display: flex; flex-direction: column; gap: 9px; }
    .q-opt {
      text-align: left; padding: 12px 14px;
      border: 2px solid var(--border); border-radius: 10px;
      cursor: pointer; font-size: .86rem; background: #fff; color: var(--text);
      transition: all .15s; line-height: 1.45; min-height: 48px;
    }
    .q-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-l); }
    .q-opt.correct { border-color: var(--green); background: #dcfce7; color: #14532d; }
    .q-opt.wrong   { border-color: var(--red);   background: #fee2e2; color: #7f1d1d; }
    .q-opt:disabled { cursor: default; }
    .q-fb    { margin-top: 10px; font-size: .83rem; font-weight: 600; min-height: 18px; }
    .q-fb.ok { color: var(--green); }
    .q-fb.bad{ color: var(--red); }
    .q-next  { margin-top: 15px; background: var(--accent); color: #fff; border: none; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-size: .86rem; font-weight: 700; display: none; min-height: 44px; }
    .q-next.show { display: inline-block; }
    .q-results   { text-align: center; padding: 10px 0; }
    .q-score     { font-size: 3rem; font-weight: 700; color: var(--accent); }
    .q-score-lbl { font-size: .86rem; color: var(--muted); margin-bottom: 6px; }
    .q-msg       { font-size: .98rem; font-weight: 700; color: var(--primary); margin: 12px 0 18px; line-height: 1.5; }
    .q-review    { text-align: left; margin-bottom: 18px; }
    .q-rev-item  { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
    .q-rev-item .rw { font-weight: 700; color: var(--primary); }
    .btn-retry { background: var(--accent); color: #fff; border: none; padding: 11px 24px; border-radius: 22px; cursor: pointer; font-size: .87rem; font-weight: 700; margin-right: 8px; min-height: 44px; }
    .btn-cls   { background: #f1f5f9; color: var(--text); border: none; padding: 11px 24px; border-radius: 22px; cursor: pointer; font-size: .87rem; min-height: 44px; }

    /* Loading / Error */
    .loading { display: flex; align-items: center; justify-content: center; padding: 44px 20px; color: var(--muted); font-family: sans-serif; font-size: .86rem; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-box { display: flex; flex-direction: column; align-items: center; padding: 38px 20px; color: var(--muted); font-family: sans-serif; text-align: center; gap: 10px; }
    .err-box .ei { font-size: 2.3rem; }

V['quantitative easing'] = { pos:'noun', ja:'量的緩和', def:'A central bank policy of buying assets to inject money into the economy.', ex:'Quantitative easing kept borrowing costs near zero throughout the recovery.' };

/* ================================================================
   STATE
================================================================ */
let apiKey   = localStorage.getItem('guardian_key') || '';
let articles = [];
let curArt   = null;
let artVocab = [];
let jaTitles = {};
let curParas = [];       // paragraphs of current article
let curSents = {};       // "pi-si" -> sentence string
let sentCache = {};      // "pi-si" -> translated string
let fullTlCache = null;  // [para0_ja, para1_ja, ...]
let quiz = { qs:[], cur:0, score:0, history:[] };

/* ================================================================
   KEY MANAGEMENT
================================================================ */
function saveKey() {
  const v = document.getElementById('key-input').value.trim();
  if (!v) return;
  apiKey = v; localStorage.setItem('guardian_key', v);
  updateKeyUI(); loadNews();
}
function dismissBanner() { document.getElementById('key-banner').classList.add('hidden'); }
function updateKeyUI() {
  document.getElementById('key-dot').className = 'key-dot ' + (apiKey ? 'ok' : 'bad');
  document.getElementById('key-lbl').textContent = apiKey ? 'APIキー設定済み' : 'APIキー未設定';
  if (apiKey) document.getElementById('key-banner').classList.add('hidden');
}

/* ================================================================
   TABS
================================================================ */
let siteBtnsInited = false;
function switchTab(n) {
  document.getElementById('tab1').className = 'tab' + (n===1?' active':'');
  document.getElementById('tab2').className = 'tab' + (n===2?' active':'');
  document.getElementById('pane1').className = 'tab-pane' + (n===1?'':' hidden');
  document.getElementById('pane2').className = 'tab-pane' + (n===2?'':' hidden');
  if (n === 2 && !siteBtnsInited) { siteBtnsInited = true; initSiteBtns(); }
}

/* ================================================================
   GUARDIAN API
================================================================ */
async function loadNews() {
  const list = document.getElementById('news-list');
  document.getElementById('art-count').textContent = '';
  list.innerHTML = '<div class="loading"><div class="spinner"></div>記事を取得中...</div>';
  const key = apiKey || 'test';
  const url = `https://content.guardianapis.com/search?section=business&show-fields=bodyText,headline,trailText,wordcount&page-size=20&order-by=newest&api-key=${key}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const results = data.response?.results || [];
    if (!results.length) throw new Error('no results');
    articles = results.map(r => ({
      id: r.id,
      title: r.fields?.headline || r.webTitle || '',
      bodyText: r.fields?.bodyText || r.fields?.trailText || '',
      trailText: r.fields?.trailText || '',
      webUrl: r.webUrl || '',
      date: r.webPublicationDate || '',
      wordcount: parseInt(r.fields?.wordcount || '0', 10),
    }));
    renderList();
    translateHeadlines();
  } catch(e) {
    list.innerHTML = `<div class="err-box"><div class="ei">⚠️</div>
      <div>記事の取得に失敗しました</div>
      <div style="font-size:.76rem;color:#94a3b8">${apiKey ? 'APIキーを確認してください' : 'APIキーを設定するか接続を確認してください'}</div>
      <button class="btn-reload" onclick="loadNews()">再試行</button></div>`;
  }
}

function renderList() {
  const list = document.getElementById('news-list');
  document.getElementById('art-count').textContent = articles.length + '件';
  list.innerHTML = articles.map((a, i) => {
    const text = a.bodyText || a.trailText;
    const vc = countVocab(a.title + ' ' + text);
    const wc = a.wordcount || text.split(/\s+/).filter(Boolean).length;
    const [dlbl, dcls] = diff3(vc, wc);
    const jaHtml = jaTitles[a.id]
      ? `<div class="ni-ja">${esc(jaTitles[a.id])}</div>`
      : `<div class="ni-ja"><span class="tl-spin"></span></div>`;
    const fullTag = a.bodyText && a.bodyText.length > 300 ? '' : `<span style="color:#94a3b8;font-size:.62rem">（概要）</span>`;
    return `<div class="news-item" id="ni-${i}" onclick="openArticle(${i})">
      <div class="ni-en">${esc(a.title)}</div>
      ${jaHtml}
      <div class="ni-meta"><span>${fmtDate(a.date)}</span><span class="diff ${dcls}">${dlbl}</span><span>${wc > 0 ? wc + '語' : ''}${fullTag}</span></div>
    </div>`;
  }).join('');
}

async function translateHeadlines() {
  for (let i = 0; i < articles.length; i++) {
    const a = articles[i];
    if (jaTitles[a.id]) continue;
    try {
      jaTitles[a.id] = await translateText(a.title);
      const el = document.querySelector(`#ni-${i} .ni-ja`);
      if (el) el.textContent = jaTitles[a.id];
    } catch(_) {
      const el = document.querySelector(`#ni-${i} .ni-ja`);
      if (el) el.textContent = '';
    }
    await sleep(150);
  }
}

/* ================================================================
   OPEN ARTICLE  /  PASTE
================================================================ */
function openArticle(i) {
  const a = articles[i];
  curArt = { title: a.title, titleJa: jaTitles[a.id] || '', bodyText: a.bodyText || a.trailText, webUrl: a.webUrl, date: a.date, wordcount: a.wordcount, source: 'The Guardian' };
  sentCache = {}; curSents = {}; fullTlCache = null;
  showArticleScreen();
}
function startPaste() {
  const title = document.getElementById('paste-title').value.trim() || 'Pasted Article';
  const body  = document.getElementById('paste-body').value.trim();
  if (!body || body.length < 30) { alert('記事本文を貼り付けてください。'); return; }
  curArt = { title, titleJa: '', bodyText: body, webUrl: '', date: new Date().toISOString(), wordcount: body.split(/\s+/).filter(Boolean).length, source: '貼り付け記事' };
  sentCache = {}; curSents = {}; fullTlCache = null;
  showArticleScreen();
}

/* ================================================================
   SCREEN TRANSITIONS
================================================================ */
function showArticleScreen() {
  document.getElementById('s-list').classList.add('hidden');
  document.getElementById('s-article').classList.remove('hidden');
  renderArticle();
  window.scrollTo(0, 0);
}
function goBack() {
  document.getElementById('s-article').classList.add('hidden');
  document.getElementById('s-list').classList.remove('hidden');
}

/* ================================================================
   RENDER ARTICLE
================================================================ */
function renderArticle() {
  const a = curArt;
  curParas = getParas(a.bodyText);
  artVocab = extractVocab(a.title + ' ' + a.bodyText);
  const wc = a.wordcount || a.bodyText.split(/\s+/).filter(Boolean).length;
  const rt = Math.max(1, Math.round(wc / 180));
  const vc = artVocab.length;
  const hasFullText = curParas.length >= 3;

  document.getElementById('art-hdr-title').textContent = a.title;

  const titleJaHtml = a.titleJa ? `<div class="art-title-ja">🇯🇵 ${esc(a.titleJa)}</div>` : '';
  const srcHtml = a.webUrl ? `<a href="${esc(a.webUrl)}" target="_blank" rel="noopener">🔗 元記事</a>` : '';

  document.getElementById('art-wrap').innerHTML = `

      ${srcHtml}
    </div>
    <div class="stats-bar">
      <span>✨ 経済用語 ${vc}個</span>

      ${!hasFullText ? '<span style="color:#dc2626;font-size:.71rem">⚠ 全文はAPIキー設定後に</span>' : ''}
    </div>
    <div id="body-area">${buildBody()}</div>
    ${vc > 0 ? vocabSectionHtml(vc) : ''}

}

/* ================================================================
   SENTENCE SPLITTING + BODY BUILDER
================================================================ */
function getParas(text) {
  return text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 50);
}

function splitSentences(text) {
  // Split on .!? followed by space + uppercase letter, preserving abbreviations imperfectly
  const results = [];
  let buf = '';
  for (let i = 0; i < text.length; i++) {
    buf += text[i];
    const c = text[i];
    const next  = text[i + 1] || '';
    const next2 = text[i + 2] || '';
    if ((c === '.' || c === '!' || c === '?') && next === ' ' && /[A-Z"'"]/.test(next2)) {
      results.push(buf.trim());
      buf = '';
      i++; // skip the space
    }
  }
  if (buf.trim().length > 3) results.push(buf.trim());
  return results.length ? results : [text];
}

function buildBody() {
  if (!curParas.length) {
    return '<p style="color:var(--muted);font-family:sans-serif;font-size:.88rem;padding:8px 0">記事本文が取得できませんでした。APIキーを設定して再度お試しください。</p>';
  }
  let html = '';
  curParas.forEach((para, pi) => {
    const sents = splitSentences(para);
    let sentHtml = '';
    sents.forEach((sent, si) => {
      const key = `${pi}-${si}`;
      curSents[key] = sent;
      sentHtml += `
        <div class="sent-item" id="si-${pi}-${si}">
          <div class="sent-en-row">
            <button class="sent-btn" id="sb-${pi}-${si}" onclick="toggleSentTl(${pi},${si})" title="タップで翻訳">🇯🇵</button>
            <span class="sent-en">${highlightText(sent)}</span>
          </div>
          <div class="sent-ja" id="sj-${pi}-${si}"></div>
        </div>`;
    });
    html += `<div class="para-block">${sentHtml}</div>`;
  });
  return html;
}

/* ================================================================
   SENTENCE TRANSLATION TOGGLE
================================================================ */
async function toggleSentTl(pi, si) {
  const jaEl = document.getElementById(`sj-${pi}-${si}`);
  const btn  = document.getElementById(`sb-${pi}-${si}`);
  if (!jaEl) return;

  // Already open → close
  if (jaEl.classList.contains('open')) {
    jaEl.classList.remove('open');
    btn && btn.classList.remove('active');
    return;
  }

  // Open
  jaEl.classList.add('open');
  btn && btn.classList.add('active');

  const key = `${pi}-${si}`;
  if (sentCache[key] !== undefined) {
    jaEl.textContent = sentCache[key];
    jaEl.className = 'sent-ja open';
    return;
  }

  // Translate
  jaEl.textContent = '翻訳中...';
  jaEl.className = 'sent-ja open loading';
  try {
    const ja = await translateText(curSents[key] || '');
    sentCache[key] = ja;
    jaEl.textContent = ja;
    jaEl.className = 'sent-ja open';
  } catch(_) {
    sentCache[key] = '翻訳に失敗しました。接続を確認してください。';
    jaEl.textContent = sentCache[key];
    jaEl.className = 'sent-ja open';
  }
}

async function showFullTl() {
  document.getElementById('full-tl-overlay').classList.remove('hidden');
  const body = document.getElementById('full-tl-body');

  if (fullTlCache) { renderFullTlBody(fullTlCache); return; }
  if (!curParas.length) { body.innerHTML = '<p style="color:var(--muted);font-family:sans-serif">本文がありません。</p>'; return; }

  fullTlCache = new Array(curParas.length).fill(null);
  body.innerHTML = `<div class="full-tl-progress">段落 0 / ${curParas.length} を翻訳中...</div>` +
    curParas.map((_, i) => `<div class="full-tl-para" id="ftp-${i}" style="color:var(--muted)">翻訳中...</div>`).join('');

  for (let i = 0; i < curParas.length; i++) {
    const el = document.getElementById(`ftp-${i}`);
    const prg = body.querySelector('.full-tl-progress');
    if (prg) prg.textContent = `段落 ${i + 1} / ${curParas.length} を翻訳中...`;
    try {
      const ja = await translateText(curParas[i]);
      fullTlCache[i] = ja;

    } catch(_) {
      fullTlCache[i] = '[翻訳失敗]';

/* ================================================================
   VOCAB HIGHLIGHTING
================================================================ */
function extractVocab(text) {
  const tl = text.toLowerCase();
  const found = new Set();
  const terms = Object.keys(V).sort((a, b) => b.length - a.length);
  for (const t of terms) {
    if (!V[t]) continue;
    let si = 0;
    while (true) {
      const idx = tl.indexOf(t.toLowerCase(), si);
      if (idx === -1) break;
      si = idx + 1;
      const pre = idx === 0 || !/[a-z]/i.test(text[idx - 1]);
      const after = text[idx + t.length] || '';
      const after2 = text[idx + t.length + 1] || '';
      const isPlural = (after === 's' || after === 'S') && !/[a-z]/i.test(after2);
      const post = after === '' || !/[a-z]/i.test(after) || isPlural;
      if (pre && post) { found.add(t); break; }
    }
  }
  return [...found];
}
function countVocab(text) { return extractVocab(text).length; }
function diff3(vc, wc) {
  if (vc <= 1 || wc === 0) return ['Easy', 'diff-e'];
  if (vc <= 3 || vc / wc < 0.06) return ['Medium', 'diff-m'];
  return ['Hard', 'diff-h'];
}
function highlightText(text) {
  const tl = text.toLowerCase();
  const hits = [];
  const terms = Object.keys(V).sort((a, b) => b.length - a.length);
  for (const t of terms) {
    if (!V[t]) continue;
    const tlo = t.toLowerCase();
    let si = 0;
    while (true) {
      const idx = tl.indexOf(tlo, si);
      if (idx === -1) break;
      const pre = idx === 0 || !/[a-z]/i.test(text[idx - 1]);
      const after = text[idx + t.length] || '';
      const after2 = text[idx + t.length + 1] || '';
      const isPlural = (after === 's' || after === 'S') && !/[a-z]/i.test(after2);
      const post = after === '' || !/[a-z]/i.test(after) || isPlural;
      const end = (pre && post && isPlural) ? idx + t.length + 1 : idx + t.length;
      if (pre && post) hits.push({ start: idx, end, term: t });
      si = idx + 1;
    }
  }
  hits.sort((a, b) => a.start - b.start || b.end - a.end);
  const clean = []; let last = -1;
  for (const h of hits) { if (h.start >= last) { clean.push(h); last = h.end; } }
  let out = '', pos = 0;
  for (const h of clean) {
    out += esc(text.slice(pos, h.start));
    out += `<span class="vt" onclick="showPopup('${escAttr(h.term)}',event)">${esc(text.slice(h.start, h.end))}</span>`;
    pos = h.end;
  }
  return out + esc(text.slice(pos));
}

/* ================================================================
   POPUP
================================================================ */
function showPopup(word, evt) {
  evt.stopPropagation();
  const key = Object.keys(V).find(k => k.toLowerCase() === word.toLowerCase()) || word;
  const v = V[key]; if (!v) return;
  document.getElementById('p-word').textContent = key;
  document.getElementById('p-pos').textContent  = v.pos;
  document.getElementById('p-ja').textContent   = '🇯🇵 ' + v.ja;
  document.getElementById('p-def').textContent  = v.def;
  document.getElementById('p-ex').textContent   = '"' + v.ex + '"';
  const pop = document.getElementById('popup');
  pop.classList.remove('hidden');
  const r = evt.target.getBoundingClientRect();
  const pw = 310, ph = 230;
  let lx = r.left + window.scrollX;
  let ty = r.bottom + window.scrollY + 8;
  if (lx + pw > window.innerWidth) lx = window.innerWidth - pw - 10;
  if (ty + ph > window.innerHeight + window.scrollY) ty = r.top + window.scrollY - ph - 8;
  pop.style.left = Math.max(6, lx) + 'px';
  pop.style.top  = Math.max(6, ty) + 'px';
}
function closePopup() { document.getElementById('popup').classList.add('hidden'); }
document.addEventListener('click', e => {
  const p = document.getElementById('popup');
  if (!p.classList.contains('hidden') && !p.contains(e.target)) closePopup();
});

async function loadSiteArticles(i) {
  const box = document.getElementById('art-links-box');

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xml = await res.text();
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = [...doc.querySelectorAll('item')].slice(0, 12).map(item => {
      // linkタグかguidタグからURLを取得
      const linkText = item.querySelector('link')?.textContent?.trim() || '';
      const guidText = item.querySelector('guid')?.textContent?.trim() || '';
      const link = linkText.startsWith('http') ? linkText : (guidText.startsWith('http') ? guidText : '');
      return {
        title: item.querySelector('title')?.textContent?.trim() || '',
        link,
        date: item.querySelector('pubDate')?.textContent?.trim() || '',
      };
    }).filter(it => it.title && it.link);

      <a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--accent)">
        ${esc(s.name)} のサイトを直接開く →
      </a>

}

/* ================================================================
   TRANSLATION  — Google gtx primary, MyMemory fallback
================================================================ */
async function translateText(text) {
  if (!text || text.length < 3) return text;
  // Primary: Google Translate (unofficial gtx endpoint)
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (res.ok) {
      const data = await res.json();
      const result = data[0].map(s => (s && s[0]) ? s[0] : '').join('').trim();
      if (result) return result;
    }
  } catch(_) {}
  // Fallback: MyMemory (free, no key)
  const mm = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 500))}&langpair=en|ja`;
  const r2 = await fetch(mm, { signal: AbortSignal.timeout(6000) });
  const d2 = await r2.json();
  const res2 = d2.responseData?.translatedText || '';
  if (res2 && res2 !== 'QUERY LENGTH LIMIT EXCEDEED') return res2;
  throw new Error('translation failed');
}

/* ================================================================
   QUIZ
================================================================ */
function startQuiz() {
  const pool = artVocab.filter(w => V[w]).slice(0, 5);
  if (!pool.length) return;
  const allK = Object.keys(V).filter(k => V[k]);
  quiz.qs = pool.map(word => {
    const v = V[word];
    const wrongs = allK.filter(k => k !== word).sort(() => Math.random() - .5).slice(0, 3);
    return { word, ja: v.ja, opts: [
      { text: v.def, correct: true },
      { text: V[wrongs[0]]?.def || 'An economic indicator', correct: false },
      { text: V[wrongs[1]]?.def || 'A financial instrument', correct: false },
      { text: V[wrongs[2]]?.def || 'A market trend', correct: false },
    ].sort(() => Math.random() - .5) };
  });
  quiz.cur = 0; quiz.score = 0; quiz.history = [];
  document.getElementById('quiz-overlay').classList.remove('hidden');
  renderQ();
}
function renderQ() {
  const { qs, cur } = quiz;
  if (cur >= qs.length) { showResults(); return; }
  const q = qs[cur];
  document.getElementById('quiz-body').innerHTML = `
    <div class="q-prog-lbl">問題 ${cur+1} / ${qs.length}</div>
    <div class="q-prog-bar"><div class="q-prog-fill" style="width:${Math.round(cur/qs.length*100)}%"></div></div>
    <div class="q-text">"<strong>${esc(q.word)}</strong>" の意味は？</div>
    <div class="q-hint">（日本語ヒント：${esc(q.ja)}）</div>
    <div class="q-opts">
      ${q.opts.map((o, i) => `<button class="q-opt" onclick="pickA(${i})" data-correct="${o.correct}">${esc(o.text)}</button>`).join('')}
    </div>
    <div class="q-fb" id="qfb"></div>
    <button class="q-next" id="qnext" onclick="nextQ()">${cur+1 < qs.length ? '次の問題 →' : '結果を見る'}</button>`;
}
function pickA(i) {
  const opts = document.querySelectorAll('.q-opt');
  if (opts[0].disabled) return;
  opts.forEach(o => o.disabled = true);
  const ok = opts[i].dataset.correct === 'true';
  if (ok) { opts[i].classList.add('correct'); quiz.score++; document.getElementById('qfb').className='q-fb ok'; document.getElementById('qfb').textContent='✅ 正解！'; }
  else    { opts[i].classList.add('wrong'); opts.forEach(o => { if (o.dataset.correct==='true') o.classList.add('correct'); }); document.getElementById('qfb').className='q-fb bad'; document.getElementById('qfb').textContent='❌ 不正解。正解は緑です。'; }
  quiz.history.push({ word: quiz.qs[quiz.cur].word, ok });
  document.getElementById('qnext').classList.add('show');
}
function nextQ() { quiz.cur++; renderQ(); }
function showResults() {
  const { score, qs, history } = quiz;
  const total = qs.length, pct = Math.round(score/total*100);
  const msg = pct>=80 ? '🎉 素晴らしい！経済英語マスターに近づいています！' : pct>=60 ? '👍 よくできました！さらに練習しましょう。' : '📖 もう一度記事を読んで用語を確認しましょう！';
  document.getElementById('quiz-body').innerHTML = `
    <div class="q-results">
      <div class="q-score">${score}/${total}</div>
      <div class="q-score-lbl">正解率 ${pct}%</div>
      <div class="q-msg">${msg}</div>
      <div class="q-review">${history.map(h=>`<div class="q-rev-item"><span style="color:${h.ok?'var(--green)':'var(--red)'}">${h.ok?'✅':'❌'}</span> <span class="rw">${esc(h.word)}</span> <span style="color:var(--muted);font-size:.75rem">— ${esc(V[h.word]?.ja||'')}</span></div>`).join('')}</div>
      <button class="btn-retry" onclick="startQuiz()">🔄 もう一度</button>
      <button class="btn-cls" onclick="closeQuiz()">閉じる</button>
    </div>`;
}
function closeQuiz() { document.getElementById('quiz-overlay').classList.add('hidden'); }
function closeQuizOuter(e) { if (e && document.getElementById('quiz-modal').contains(e.target)) return; closeQuiz(); }

================================================================ */
function esc(s='')    { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s='') { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function fmtDate(ds) {
  if (!ds) return '';
  try { return new Date(ds).toLocaleDateString('ja-JP',{year:'numeric',month:'short',day:'numeric'}); } catch { return ds; }
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
